services:
  - type: web
    name: project-moonlight
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ROOM_PASSCODE
        value: moonlight-alpha
